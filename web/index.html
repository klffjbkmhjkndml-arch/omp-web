<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Oh My Pi</title>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1b'/%3E%3Ctext x='16' y='22.5' font-size='19' text-anchor='middle' fill='white' font-family='monospace' font-weight='700'%3E%CF%80%3C/text%3E%3C/svg%3E" />
		<script>
			try {
				const p = JSON.parse(localStorage.getItem("omp-web:prefs") || "{}");
				if (p.theme && p.theme !== "system") document.documentElement.setAttribute("data-theme", p.theme);
				if (p.fontSize) document.documentElement.setAttribute("data-font", p.fontSize);
			} catch {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
